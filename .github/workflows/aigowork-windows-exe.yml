name: AiGoWork Windows x64 EXE installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      AIGOWORK_PACKAGE_VERSION: 0.22.5-local.20261031.2d2808e
      HERMES_BUILD_COMMIT: 2d2808ee84549f9836b0056750265058e5488a8a
      HERMES_PAYLOAD_VERSION: 0.22.5-local.20261031.2d2808e
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: 2d2808ee84549f9836b0056750265058e5488a8a
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            upstream/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked Node tools and verify installer policy
        run: |
          set -euo pipefail
          npm ci --workspace apps/desktop --include-workspace-root --ignore-scripts --no-audit --no-fund
          node --test scripts/aigowork-windows-exe.test.mjs
          npm ci --prefix upstream --workspace apps/desktop --include-workspace-root --ignore-scripts --no-audit --no-fund
      - name: Prepare AiGoWork icons
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python scripts/aigowork-windows-icons.py
          cp apps/desktop/assets/icon.png upstream/apps/desktop/assets/icon.png
          cp apps/desktop/assets/icon.ico upstream/apps/desktop/assets/icon.ico
          cp apps/desktop/assets/icon-dark.ico upstream/apps/desktop/assets/icon-dark.ico
      - name: Build and check the pinned desktop source
        working-directory: upstream
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HERMES_BUILD_COMMIT"
          node apps/desktop/scripts/stage-native-deps.mjs
          npm run typecheck --workspace apps/desktop
          node apps/desktop/scripts/build.mjs
          node apps/desktop/scripts/run-electron-builder.mjs --win --x64 --dir "-c.extraMetadata.version=$HERMES_PAYLOAD_VERSION"
      - name: Verify payload provenance and prepare EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stamp = Get-Content upstream/apps/desktop/build/install-stamp.json | ConvertFrom-Json
          if ($stamp.commit -ne $env:HERMES_BUILD_COMMIT -or $stamp.displayVersion -ne $env:HERMES_PAYLOAD_VERSION) { throw 'Desktop provenance mismatch' }
          $payload = (Resolve-Path upstream/apps/desktop/release/win-unpacked).Path
          $executableName = $stamp.identity.windowsExecutableName
          if (!$executableName -or $executableName -notmatch '^[A-Za-z][A-Za-z0-9 ._-]{0,79}$') { throw 'Invalid executable name in desktop provenance' }
          Move-Item (Join-Path $payload "$executableName.exe") (Join-Path $payload 'AiGoWork.exe')
          "AIGOWORK_PREPACKAGED_DIR=$payload" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force apps/desktop/release-exe | Out-Null
          Copy-Item upstream/apps/desktop/build/install-stamp.json apps/desktop/release-exe/source-stamp.json
      - name: Build Chinese EXE installation wizard
        run: |
          set -euo pipefail
          node scripts/aigowork-windows-exe.mjs 2>&1 | tee windows-exe-package.log
      - name: Verify installation and desktop startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem apps/desktop/release-exe/AiGoWork-Setup-*-win-x64.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'aigowork-install-test'
          $setup = Start-Process $installer -ArgumentList @('/S', '/currentuser', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $exe = Join-Path $installDir 'AiGoWork.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable is missing' }
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP 'aigowork-test-home'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'aigowork-test-appdata'
          $process = Start-Process $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 3
              $process.Refresh()
              if ($process.HasExited) { throw "Desktop exited during startup with code $($process.ExitCode)" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) { throw 'No desktop window appeared' }
            $logPath = Join-Path $env:HERMES_HOME 'logs/desktop.log'
            if (!(Test-Path $logPath)) { throw 'Desktop startup log was not created' }
            $report = @{ sourceCommit = $env:HERMES_BUILD_COMMIT; version = $env:AIGOWORK_PACKAGE_VERSION; installerExitCode = $setup.ExitCode; startupProcessAlive = !$process.HasExited; windowHandle = $process.MainWindowHandle.ToInt64(); startupLogCreated = $true; installerSha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant(); testedOn = [Environment]::OSVersion.Version.ToString(); conversationTested = $false; authenticodeSigned = $false }
            $report | ConvertTo-Json | Set-Content apps/desktop/release-exe/verification.json
            Copy-Item $logPath apps/desktop/release-exe/windows-startup.log
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: AiGoWork-EXE-x64-v0.22.5
          path: |
            apps/desktop/release-exe/AiGoWork-Setup-*-win-x64.exe
            apps/desktop/release-exe/verification.json
            apps/desktop/release-exe/source-stamp.json
            apps/desktop/release-exe/windows-startup.log
            windows-exe-package.log
          if-no-files-found: error
          retention-days: 14
