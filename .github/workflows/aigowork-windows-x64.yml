name: AiGoWork Windows x64 package

on:
  push:
    branches: [aigowork-windows-x64]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 MSIX
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HERMES_PAYLOAD_TAG: v0.21.7
      HERMES_RELEASE_EPOCH: "1791775065"
      AIGOWORK_WINDOWS_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Windows icons
        run: |
          python -m pip install Pillow
          python scripts/aigowork-windows-icons.py

      - name: Build desktop client
        run: npm run build --workspace apps/desktop

      - name: Package MSIX
        run: npm run builder --workspace apps/desktop -- --win --x64 msix -c.extraMetadata.version=0.21.7

      - name: Sign custom installation package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = New-SelfSignedCertificate -Type Custom -Subject 'CN=AiGoWork' -KeyUsage DigitalSignature -FriendlyName 'AiGoWork Desktop Package' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -NotAfter (Get-Date).AddYears(2)
          $tools = Get-Content apps/desktop/build/packager/win32-x64/prepared.json | ConvertFrom-Json
          $package = Get-ChildItem apps/desktop/release/*-win-x64.msix | Select-Object -First 1
          & $tools.windows.signtool sign /fd SHA256 /sha1 $certificate.Thumbprint $package.FullName
          if ($LASTEXITCODE -ne 0) { throw 'MSIX signing failed' }
          New-Item -ItemType Directory -Force apps/desktop/release/windows-installer | Out-Null
          Copy-Item $package.FullName apps/desktop/release/windows-installer/AiGoWork-0.21.7-win-x64.msix
          Export-Certificate -Cert $certificate -FilePath apps/desktop/release/windows-installer/AiGoWork.cer | Out-Null
          Copy-Item scripts/aigowork-windows-install.ps1 apps/desktop/release/windows-installer/Install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AiGoWork-Windows-x64-v0.21.7
          path: apps/desktop/release/windows-installer/*
          if-no-files-found: error
          retention-days: 14
